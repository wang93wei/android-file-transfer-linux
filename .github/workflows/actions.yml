name: Android File Transfer for Linux (and macOS!)

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - MacOS_I8n_Fix
      - github_action_optimization_v2
    tags:
      - "v*"

permissions: write-all

jobs:
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install qtbase5-dev qt5-qmake qttools5-dev qttools5-dev-tools libgtk2.0-dev libfuse3-dev libfuse2 libmagic-dev libtag1-dev libssl-dev ninja-build cmake

      - name: Configure Build
        run: cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX:PATH=appdir/usr -B build -GNinja .

      - name: Build Application
        run: ninja -j$(nproc) -C build

      - name: Install Application
        run: ninja -C build install

      - name: Create AppImage
        run: |
          sed -i -e 's|^Name=.*|Name=Android File Transfer For Linux|g' build/appdir/usr/share/applications/android-file-transfer.desktop
          wget -c -q "https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage"
          chmod a+x linuxdeployqt-continuous-x86_64.AppImage
          unset QTDIR
          unset QT_PLUGIN_PATH
          unset LD_LIBRARY_PATH
          export VERSION=$(git rev-parse --short HEAD)
          ./linuxdeployqt-continuous-x86_64.AppImage build/appdir/usr/share/applications/*.desktop -bundle-non-qt-libs -appimage
          find build/appdir -executable -type f -exec ldd {} \; | grep " => /usr" | cut -d " " -f 2-3 | sort | uniq

      - name: Upload to Release (Tag)
        if: github.ref_type == 'tag'
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitBody: true
          omitName: true
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: ./Android*.AppImage*
          tag: ${{ github.ref_name }}
          makeLatest: true

      - name: Upload to Continuous Release (Push)
        if: github.ref_type != 'tag'
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitBody: true
          omitName: true
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: ./Android*.AppImage*
          tag: continuous
          prerelease: true
          removeArtifacts: true

  build-macos:
    name: Build macOS
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            target: x86_64-apple-darwin
            arch: x64
          - os: macos-latest
            target: aarch64-apple-darwin  
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew tap homebrew/cask
          brew install qt@5 homebrew/cask/macfuse taglib openssl@1.1 cmake ninja libmagic
          
      - name: Set OpenSSL Path (Intel)
        if: matrix.arch == 'x64'
        run: |
          echo "OPENSSL_ROOT_DIR=/usr/local/opt/openssl@1.1" >> $GITHUB_ENV
          echo "OPENSSL_LIBRARIES=/usr/local/opt/openssl@1.1/lib" >> $GITHUB_ENV
          
      - name: Set OpenSSL Path (ARM64)
        if: matrix.arch == 'arm64'
        run: |
          echo "OPENSSL_ROOT_DIR=/opt/homebrew/opt/openssl@1.1" >> $GITHUB_ENV
          echo "OPENSSL_LIBRARIES=/opt/homebrew/opt/openssl@1.1/lib" >> $GITHUB_ENV

      - name: Configure Build (Intel)
        if: matrix.arch == 'x64'
        run: |
          cmake -DCMAKE_OSX_DEPLOYMENT_TARGET=10.12 \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH=$(brew --prefix qt@5) \
                -DOPENSSL_ROOT_DIR=${OPENSSL_ROOT_DIR} \
                -DOPENSSL_LIBRARIES=${OPENSSL_LIBRARIES} \
                -DCMAKE_INSTALL_PREFIX=appdir \
                -DCMAKE_INSTALL_NAME_TOOL=/usr/bin/install_name_tool \
                -B build -G Ninja .

      - name: Configure Build (Apple Silicon)
        if: matrix.arch == 'arm64'
        run: |
          cmake -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH=$(brew --prefix qt@5) \
                -DOPENSSL_ROOT_DIR=${OPENSSL_ROOT_DIR} \
                -DOPENSSL_LIBRARIES=${OPENSSL_LIBRARIES} \
                -DCMAKE_INSTALL_PREFIX=appdir \
                -DCMAKE_OSX_ARCHITECTURES=arm64 \
                -DBUILD_PYTHON=OFF \
                -DCMAKE_INSTALL_NAME_TOOL=/usr/bin/install_name_tool \
                -B build -G Ninja .

      - name: Build Application
        run: ninja -j$(sysctl -n hw.ncpu) -C build

      - name: Install Application
        run: ninja -C build install

      - name: Package Application (ZIP)
        run: |
          # 跳过 macdeployqt，直接打包 .app 文件
          mv appdir/android-file-transfer.app appdir/Android\ File\ Transfer\ for\ Linux.app
          
          # 复制图标文件到 app 包内
          cp osx/android-file-transfer.icns appdir/Android\ File\ Transfer\ for\ Linux.app/Contents/Resources/ || true
          
          # 创建 ZIP 包，包含架构信息
          cd appdir
          if [ "${{ matrix.arch }}" == "arm64" ]; then
            zip -r ../AndroidFileTransferForLinux-ARM64.zip "Android File Transfer for Linux.app"
            echo "Created ARM64 ZIP package"
          else
            zip -r ../AndroidFileTransferForLinux.zip "Android File Transfer for Linux.app"
            echo "Created Intel ZIP package"
          fi
          cd ..
          
          echo "Package contents:"
          unzip -l AndroidFileTransferForLinux*.zip | head -20
          
      - name: Check Package Files
        run: |
          echo "Checking for package files..."
          ls -la *.zip 2>/dev/null || echo "No ZIP files found in workspace"
          find . -name "*.zip" 2>/dev/null || echo "No ZIP files found"

      - name: Code Sign (Optional)
        if: github.ref_type == 'tag'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            echo "Code signing application..."
            echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
            security create-keychain -p "" build.keychain
            security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
            security unlock-keychain -p "" build.keychain
            
            codesign --force --deep --sign "$APPLE_SIGNING_IDENTITY" \
                    --options runtime \
                    appdir/Android\ File\ Transfer\ for\ Linux.app/* || echo "Code signing failed, continuing without signing"
          else
            echo "No code signing certificate available, skipping code signing"
          fi

      - name: Upload to Release (Tag)
        if: github.ref_type == 'tag'
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitBody: true
          omitName: true
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: AndroidFileTransferForLinux*.zip
          tag: ${{ github.ref_name }}
          makeLatest: true

      - name: Upload to Continuous Release (Push)
        if: github.ref_type != 'tag'
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitBody: true
          omitName: true
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: AndroidFileTransferForLinux*.zip
          tag: continuous
          prerelease: true
          removeArtifacts: true